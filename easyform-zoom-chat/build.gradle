plugins {
    id 'com.android.library'
    id 'com.google.ar.sceneform.plugin'
}

android {
    namespace "com.example.easyformzoom"
    compileSdkVersion  project.ext.compileSdk
    defaultConfig {
        minSdkVersion project.ext.minSdk
        targetSdkVersion project.ext.targetSdk

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.multidex:multidex:2.0.1'
    implementation 'androidx.appcompat:appcompat:1.3.1'
    implementation 'com.google.android.material:material:1.4.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.0'
    implementation project(path: ':mobilertc')
    implementation project(path: ':commonlib')
    implementation project(path: ':app-scenForm')
    implementation 'com.google.firebase:firebase-messaging:17.3.4'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'

    implementation 'me.rohanpeshkar.filterablelistdialog:filterablelistdialog:0.0.1'
    implementation 'com.google.ar:core:1.35.0'
    implementation 'org.michaelbel:bottomsheet:1.2.3'
    implementation 'com.squareup.okhttp3:okhttp:3.12.1'
    implementation 'com.android.volley:volley:1.2.0'

    implementation 'com.google.android:flexbox:2.0.1'


}