// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {
    repositories {
        mavenCentral()
        jcenter()
        google()
        maven { url "https://repo.grails.org/grails/core/"}
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.6.0'
        classpath 'com.google.gms:google-services:4.3.13'
        classpath 'com.github.dcendents:android-maven-gradle-plugin:1.4.1'
        classpath 'com.jfrog.bintray.gradle:gradle-bintray-plugin:1.4'
        classpath "com.google.android.libraries.mapsplatform.secrets-gradle-plugin:secrets-gradle-plugin:2.0.1"
        //used to encrypt string in java class
        //add @StringFogIgnore annotation on class name
//        classpath 'io.michaelrocks:paranoid-gradle-plugin:0.3.5'
        classpath 'com.google.ar.sceneform:plugin:1.17.1'
        classpath 'com.google.firebase:firebase-crashlytics-gradle:2.9.1'

    }
    allprojects {
        repositories {
            jcenter()
            mavenCentral()
            google()
            maven { url "https://www.jitpack.io" }
            maven {
                url "https://github.com/jitsi/jitsi-maven-repository/raw/master/releases"
            }

 	maven { url "https://repo.grails.org/grails/core/"}
        }


        configurations.all {
            resolutionStrategy {
                // Force Kotlin versions
                force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.10'
                force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.10'
                force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.10'

                // Force React / Hermes versions
                eachDependency { DependencyResolveDetails details ->
                    if (details.requested.group == "com.facebook.react") {
                        if (details.requested.name == "react-android") {
                            details.useVersion "0.77.2"
                        }
                        if (details.requested.name == "hermes-android") {
                            details.useVersion "0.77.2"
                        }
                    }
                }
            }
        }

        project.ext {
            minSdk = 26
            targetSdk = 33
            compileSdk = 35
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}

