            storage.setItem('type20_cust_name', JSON.stringify(''));

            pageload_main();
            function pageload_main() {
                if (typeof (myApp) != "undefined") {
                    get_user_latlong_pm();

                else {
                    setTimeout(function () { pageload_main(); }, 500);
                }
            }

            document.addEventListener("backbutton", function (e) {

        $(document).ready(function () {

            var menu_smallImage = document.getElementById("menu_img_profile");
            var pro_pic_path = get_profile_pic_path_android_ios();
            if (pro_pic_path == '' || pro_pic_path == null || pro_pic_path == undefined) { }
            else {
                menu_smallImage.src = pro_pic_path;
            }

            if (F7_device == "ios") {
                $(".panel-nav-ios").show();
                $(".panel-nav").hide();
            }
            else {
                $(".panel-nav-ios").hide();
                $(".panel-nav").show();
            }

            var doc = new MkDocInits();
            doc._bindBoxInput(document);
            doc._bindBoxCP(document);
            doc._initF7(doc);
            doc._checkSession(doc);

            $("#txtsearch").on('input', function () {
                $(".no_record").remove();
                var search_str = $(this).val();
                var li_array = document.getElementById("cust_list").getElementsByTagName("li");
                for (i = 0; i < li_array.length; i++) {
                    var id = li_array[i].id;
                    if (id == '' || id == null || id == undefined) { }
                    else {
                        var data_array = document.getElementById(id).getElementsByClassName("cls_search");
                        for (j = 0; j < data_array.length; j++) {
                            var data_value = data_array[j].textContent;
                            search_str = search_str.toLowerCase();
                            data_value = data_value.toLowerCase();
                            if (data_value.indexOf(search_str) > -1) {
                                $('#cust_list > li').eq(i).css('display', 'block');
                                break;
                            } else {
                                $('#cust_list > li').eq(i).css('display', 'none');
                            }
                        }
                    }
                }
                var li_length = $("#cust_list > li:not(:hidden)").length;
                var f_li_text = $('#cust_list > li:first').text();
                if (li_length == 1 && f_li_text == 'No Record Found !') {
                    li_length = 0;
                }
                //$("#lbl_siteCount").html("Total : " + li_length + "");
                if (li_length == 0) {
                    if (f_li_text != 'No Record Found !') {
                        var list_item = '<li class="no_record"><a href="#" class="item-link item-content"><div class="item-inner item-no-pad"><div class="item-title">No Record Found !</div></div></a></li>';
                        $("#cust_list").append(list_item);
                    }
                }
            });

            // get search on search button click in device keyboad
            $("#F7_div_Search").submit(function () {
                search_site_list_common();
            });

            var ptrContent = $('.pull-to-refresh-content');
            ptrContent.on('refresh', function (e) {
                $("#cust_list").empty();
                //get_user_latlong_pm();
                refresh_site_list_common()
                myApp.pullToRefreshDone();
            });

            $('.op-show-btns').on('click', function () {
                var clickedLink = this;
                myApp.popover('.popover-show-btns', clickedLink);
            });
        });
