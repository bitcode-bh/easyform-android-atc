                        <script>
                            // F7's .floating-button is position:absolute with bottom:16px,
                            // anchored to .page (which spans the WebView's own viewport).
                            // On this Activity the keyboard triggers adjustResize, which
                            // shrinks that viewport from the bottom -- so "bottom:16px" keeps
                            // recomputing against an ever-rising bottom edge, and the button
                            // visibly climbs up the screen as you type. Switching to
                            // position:fixed with an explicit top (captured once, from the
                            // screen height before any keyboard interaction) pins it to an
                            // absolute point on the physical screen instead: the resize can
                            // shrink the viewport around it, but can't move a top offset
                            // that's no longer being recomputed. Runs once after load and
                            // deliberately never re-runs on resize/keyboard events.
                            (function () {
                                function pinNeedHelpButton() {
                                    var btn = document.getElementById('btn_company_info');
                                    if (!btn) return;
                                    var bottomMargin = 16;
                                    var h = btn.offsetHeight || 44;
                                    btn.style.position = 'fixed';
                                    btn.style.top = (window.innerHeight - bottomMargin - h) + 'px';
                                    btn.style.bottom = 'auto';
                                }
                                if (document.readyState === 'complete') {
                                    setTimeout(pinNeedHelpButton, 0);
                                } else {
                                    window.addEventListener('load', function () { setTimeout(pinNeedHelpButton, 0); });
                                }
                            })();

                            // Same problem, same fix, for the tower-photo background
                            // (login_theme_altius.css): background-size:cover recomputes
                            // against the live viewport, and adjustResize shrinks that
                            // viewport as the keyboard opens -- so the photo was visibly
                            // rescaling/panning on every keyboard open/close. Captured once
                            // here, in real px, before any keyboard interaction, and handed
                            // to the CSS as --login-bg-size so it never gets recomputed.
                            //
                            // The size itself has to reproduce what `cover` would have
                            // computed -- viewport width/height directly (a first pass at
                            // this) ignores login_bg_tower.png's own 1024x1536 aspect ratio
                            // and stretches it to fill exactly w x h. Scaling by
                            // max(w/imgW, h/imgH), the same rule `cover` itself uses, keeps
                            // the image's proportions correct while still fully filling the
                            // viewport on every side.
                            (function () {
                                var IMG_W = 1024, IMG_H = 1536;
                                function pinLoginBg() {
                                    var w = window.innerWidth;
                                    var h = window.innerHeight;
                                    if (!w || !h) return;
                                    var scale = Math.max(w / IMG_W, h / IMG_H);
                                    var bgW = Math.ceil(IMG_W * scale);
                                    var bgH = Math.ceil(IMG_H * scale);
                                    document.documentElement.style.setProperty('--login-bg-size', bgW + 'px ' + bgH + 'px');
                                }
                                if (document.readyState === 'complete') {
                                    setTimeout(pinLoginBg, 0);
                                } else {
                                    window.addEventListener('load', function () { setTimeout(pinLoginBg, 0); });
                                }
                            })();
                        </script>

        <script>
            /* Renders the Support Info popup's contact block as designed rows.

               #test_support is filled by display_support_details() with
               support_refrences1 / loging_html_code -- server-provided,
               tenant-configurable content. On this tenant it arrives as plain
               newline-separated text (verified live over CDP), which is why it
               previously rendered as an unstyled wall of text inside an
               otherwise styled popup.

               This parses those lines into the icon rows / hours pill from the
               approved design. It is deliberately conservative:
                 - anything it cannot classify is still rendered, as a plain
                   row, so no server content is ever silently dropped;
                 - if the block contains real HTML tags (another tenant may
                   send markup, not text) it leaves it completely alone;
                 - any exception falls back to the original raw block.
               In every fallback the original #test_support stays visible. */
            (function () {
                var ICONS = {
                    phone: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.362 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.338 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>',
                    sos: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9v4"/><path d="M12 17h.01"/><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L14.71 3.86a2 2 0 0 0-3.42 0z"/></svg>',
                    mail: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>',
                    cal: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>',
                    clock: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>',
                    info: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 16v-4M12 8h.01"/></svg>'

                function esc(s) {
                    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
                        .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
                }
                function jsStr(s) { return String(s).replace(/\\/g, '\\\\').replace(/'/g, "\\'"); }

                function row(iconKey, label, valueHtml, extraClass) {
                    return '<div class="sp-info-row ' + (extraClass || '') + '">'
                        + '<div class="sp-info-icon">' + ICONS[iconKey] + '</div>'
                        + '<div class="sp-info-label">' + esc(label) + '</div>'
                        + '<div class="sp-info-value">' + valueHtml + '</div>'
                        + '</div>';
                }
                function telLink(num) {
                    var clean = String(num).replace(/[^\d+]/g, '');
                    return '<a href="#" onclick="open_dialpad(\'' + jsStr(clean) + '\'); return false;">' + esc(num) + '</a>';
                }
                function mailLink(addr) {
                    return '<a href="#" onclick="open_mail(\'' + jsStr(addr) + '\'); return false;">' + esc(addr) + '</a>';
                }

                window.format_support_info = function () {
                    var src = document.getElementById('test_support');
                    var out = document.getElementById('sp_formatted');
                    if (!src || !out) return;

                    // Any fallback below must also clear the header hours, or a
                    // previous run's hours would stay in the header while the
                    // body reverts to the raw server text.
                    function resetAll() {
                        out.innerHTML = '';
                        src.style.display = '';
                        var h = document.getElementById('sp_header_hours');
                        if (h) { h.innerHTML = ''; h.style.display = 'none'; }
                    }

                    try {
                        var raw = src.innerHTML || '';
                        // Another tenant may legitimately send real markup; if so,
                        // leave it exactly as the server intended.
                        if (/<(?!br\s*\/?>)[a-z][\s\S]*>/i.test(raw)) { resetAll(); return; }

                        var lines = raw.replace(/<br\s*\/?>/gi, '\n').split('\n');
                        var days = '', timings = '', landlines = [], emergency = '', email = '', others = [];

                        for (var i = 0; i < lines.length; i++) {
                            var line = lines[i].replace(/&nbsp;/gi, ' ').trim();
                            if (!line) continue;

                            var m;
                            if (/^timings?\s*:/i.test(line)) {
                                timings = line.replace(/^timings?\s*:\s*/i, '').trim();
                            } else if ((m = line.match(/^landline\s*\d*\s*:\s*(.+)$/i))) {
                                landlines.push(m[1].trim());
                            } else if (/emergency/i.test(line) && (m = line.match(/:\s*(.+)$/))) {
                                emergency = m[1].trim();
                            } else if ((m = line.match(/^e-?mail\s*:\s*(.+)$/i))) {
                                email = m[1].trim();
                            } else if (/(mon|tue|wed|thu|fri|sat|sun)/i.test(line) && line.indexOf(':') === -1) {
                                days = line;
                            } else if (/^(it\s+)?support\s+number$/i.test(line)) {
                                // bare heading for the landlines below -- no row of its own
                                continue;
                            } else {
                                others.push(line);
                            }
                        }

                        var html = '';
                        var hoursHtml = '';

                        // Support hours live in the navy header, not the body.
                        var hoursEl = document.getElementById('sp_header_hours');
                        if (hoursEl) {
                            if (days) {
                                hoursHtml += '<span class="sp-hours-item">' + ICONS.cal + '<span>' + esc(days) + '</span></span>';
                            }
                            if (days && timings) hoursHtml += '<span class="sp-hours-divider"></span>';
                            if (timings) {
                                hoursHtml += '<span class="sp-hours-item">' + ICONS.clock + '<span>' + esc(timings) + '</span></span>';
                            }
                            hoursEl.innerHTML = hoursHtml;
                            // CSS default is display:none (collapsed until
                            // there's content); 'flex' is what .sp-header-hours
                            // is styled as, not '' (which would just fall back
                            // to that none and never show it).
                            hoursEl.style.display = hoursHtml ? 'flex' : 'none';
                        }

                        if (landlines.length) {
                            var v = '';
                            for (var j = 0; j < landlines.length; j++) {
                                if (j) v += '<span class="sp-vdiv"></span>';
                                v += telLink(landlines[j]);
                            }
                            html += row('phone', 'Support Number', '<span class="sp-split">' + v + '</span>');
                        }
                        if (emergency) html += row('sos', 'Emergency Contact', telLink(emergency), 'sp-emergency');
                        if (email) html += row('mail', 'Email', mailLink(email));

                        for (var k = 0; k < others.length; k++) {
                            var o = others[k], oi = o.indexOf(':');
                            if (oi > 0) {
                                html += row('info', o.slice(0, oi).trim(), esc(o.slice(oi + 1).trim()));
                            } else {
                                html += row('info', o, '');
                            }
                        }

                        // Only a full revert to the raw block if NEITHER the
                        // header hours NOR any body row were produced --
                        // hours alone (no other rows) is a valid, complete
                        // result and must not wipe what was just set above.
                        if (!html && !hoursHtml) { resetAll(); return; }

                        out.innerHTML = html;
                        src.style.display = 'none';   // replaced, not discarded
                    } catch (e) {
                        resetAll();
                    }
                };
            })();
        </script>
