        document.addEventListener('deviceready', function showValues() {

            pageload_main();
            function pageload_main() {
                if (typeof (myApp) != "undefined") {
                    loading();
                    var support_details = localStorage.getItem('chart_support_details');
                    if (support_details == '' || support_details == null || support_details == undefined) { }
                    else {
                        $('#btn_help').show();

                        support_details = support_details.replace(/\(/g, '(\'');
                        support_details = support_details.replace(/\)/g, '\')');

                        var start_bracket = support_details.indexOf('(\'');
                        var end_bracket = support_details.indexOf('\')', start_bracket);
                        var block_str = support_details.substring(start_bracket + 2, end_bracket);
                        var enc_block_str = encodeURIComponent(block_str);
                        support_details = support_details.replace(block_str, enc_block_str);
                        document.getElementById('div_support_details').innerHTML = support_details;
                    }

                    var circle_name = localStorage.getItem('chart_circle_name');
                    if (circle_name == '' || circle_name == null || circle_name == undefined) { }
                    else {
                        $('#lbl_circle').text(circle_name);
                    }
                    google.charts.load('current', { 'packages': ['corechart', 'annotationchart'] });

                    var t_chart_id = localStorage.getItem('chart_id');
                    if (t_chart_id == '' || t_chart_id == null || t_chart_id == undefined) {
                        var udf_id = JSON.parse(storage.getItem('udf_id'));
                        if (udf_id == 2032 || udf_id == 2041 || udf_id == 2042 || udf_id == 1958 || udf_id == 1963) {
                            // custom development 10062019 --- udf id - 1963  ATC ExistingEquipment List
                            google.charts.setOnLoadCallback(drawChart_TT);
                        }
                        else {
                            google.charts.setOnLoadCallback(drawChart);
                        }
                    }
                    else {
                        // dynamic chart_id defined in flow navigation
                        google.charts.setOnLoadCallback(drawChart_TT);
                    }

                }
                else {
                    setTimeout(function () { pageload_main(); }, 500);
                }

        function hide_chart_after_bind() {
            var find_row = $("#dynamic_chart").find(".chart_main");
            var chart_collapse = localStorage.getItem('chart_collapse');
            //chart_collapse = 'false';

            if (find_row.length > 0) {
                for (var r = 0; r < find_row.length; r++) {
                    var find_col = $(find_row[r]).find(".panel-primary");
                    for (var c = 0; c < find_col.length; c++) {
                        $(find_col[c]).attr('onclick', 'toggle_chart_divs(this)');

                        if (chart_collapse == 'false') { }
                        else {
                            var obj = find_col[c];
                            var heading_div = $(obj).find(".panel_heading");
                            var primary_div_id = $(obj).attr('id');
                            var body_divs = $(obj).find(".panel-body");
                            for (d = 0; d < body_divs.length; d++) {
                                var bdy_div = $(body_divs[d]).attr('id');
                                $('#' + bdy_div + '').addClass('noVisible');
                                $('#' + primary_div_id + '').addClass('noHeight');
                            }
                        }
                    }
                }
                $('.panel_heading i').click(function (event) {
                    event.stopPropagation();
                });
                $('.panel-body').click(function (event) {
                    event.stopPropagation();
                });
            }
        }

        function toggle_chart_divs(obj) {
            //var heading_div = $(obj).find(".panel_heading");
            //var class_flag = $(heading_div[0]).hasClass("fa fa-expand");
            //if (class_flag == false) {
            //    $(heading_div[0]).removeClass('fa fa-compress');
            //    $(heading_div[0]).addClass('fa fa-expand');
            //}
            //else {
            //    $(heading_div[0]).removeClass('fa fa-expand');
            //    $(heading_div[0]).addClass('fa fa-compress');
            //}

            var primary_div_id = $(obj).attr('id');
            var body_divs = $(obj).find(".panel-body");
            for (d = 0; d < body_divs.length; d++) {
                var bdy_div = $(body_divs[d]).attr('id');
                var class_flag = $('#' + bdy_div + '').hasClass("noVisible");
                if (class_flag == false) {
                    $('#' + bdy_div + '').addClass('noVisible');
                    $('#' + primary_div_id + '').addClass('noHeight');
                }
                else {
                    $('#' + bdy_div + '').removeClass('noVisible');
                    $('#' + primary_div_id + '').removeClass('noHeight');
                }
            }
        }

        function Drawchart_Custome(ex) {
            try {
                var result = ex.responseText;
                var json_result = JSON.parse(result);
                if (json_result[0]["status"] == 1) {

                    var data = json_result[0].data;
                    if (data == "" || data == null || data == undefined) {
                        var json_msg1 = eval('(' + json_result[0]["message"] + ')');
                    }
                    else {
                        var json_msg1 = JSON.parse(data);
                    }

                    var chart_new_function = new chart_function(json_msg1);
                    chart_new_function.ColwiseChart();

                    // loading_hide();
                    // drawChart_customize_chart();   //temporary disable
                } else {
                    var json_msg1 = json_result[0]["message"];
                    // var json_msg = eval('(' + json_msg1 + ')');
                    alert1(json_msg1);
                    enable_back_button();
                    loading_hide();
                }
            } catch (e) {
                alert1(e + "Error");
            }

        }
