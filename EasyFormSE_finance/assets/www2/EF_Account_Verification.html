        document.addEventListener('deviceready', function showValues() {
            $('.floated').addClass('not-empty-state');

            document.addEventListener("backbutton", function (e) {
                if (page_load_over == 1) {
                    go_back_from_bank();

            }, true);

        function go_back_from_bank() {
            var last_page = localStorage.getItem("last_page");
            if (last_page == "EF_User_List") {

            else {
                changeurl("Login.html");
