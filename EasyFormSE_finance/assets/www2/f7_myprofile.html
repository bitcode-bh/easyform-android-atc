<!-- My Profile Start -->
<div class="popup popup-profile" style="display: none">
    <div class="view navbar-fixed">
        <div class="pages">
            <div class="page">
                <div class="navbar">
                    <div class="navbar-inner">
                        <div class="left"><a href="#" onclick="close_my_profile(); return false;" class="link icon-only" aria-label="Back"><i class="fa fa-chevron-left" aria-hidden="true"></i></a></div>
                        <div class="center">My Profile</div>
                    </div>
                </div>
                <div class="page-content profile-content">
                    <section class="card profile-card profile-overview">
                        <div class="profile-identity">
                            <img id="img_my_profile" alt="Profile photo">
                            <div class="profile-identity-text">
                                <div id="profile_full_name"></div>
                                <div id="lblusername_my"></div>
                                <div id="lbluserrole_my"></div>
                            </div>
                        </div>
                        <div class="profile-location">
                            <i id="pro_img_gps" class="fa fa-map-marker" aria-hidden="true"></i>
                            <div><div id="pro_address"></div><div id="lbl_pro_latlong"></div></div>
                        </div>
                        <div class="profile-actions">
                            <a href="#" class="button button-fill" onclick="localStorage.setItem('change_pwd_flag', 'profile'); changeurl('change_password.html'); return false;">Change password</a>
                            <a href="#" class="button button-fill open-popover" data-popover=".popover-language">Change language</a>
                        </div>
                    </section>
                    <section class="card profile-card" id="profile_work_card">
                        <h3 class="profile-section-title"><i class="fa fa-briefcase" aria-hidden="true"></i>Work details</h3>
                        <table id="profile_user_detail" class="profile-table"></table>
                    </section>
                    <section class="card profile-card" id="profile_contact_card" style="display:none">
                        <h3 class="profile-section-title"><i class="fa fa-address-card" aria-hidden="true"></i>Personal details</h3>
                        <table id="profile_contact_detail" class="profile-table"></table>
                    </section>
                    <section class="card profile-card">
                        <h3 class="profile-section-title"><i class="fa fa-mobile" aria-hidden="true"></i>Device info</h3>
                        <table id="tbl_deviceInfo" class="profile-table"></table>
                    </section>
                </div>
            </div>
        </div>
    </div>
</div>
<!-- My Profile End -->
