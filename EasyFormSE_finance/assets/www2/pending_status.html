<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, minimal-ui">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="theme-color" content="#2196f3">

    <!-- F7 start -->
    <link href="Framework7-1.4.2/dist/css/Css_f7.css" rel="stylesheet" />
    <link href="font-awesome-4.7.0/css/font-awesome.min.css" rel="stylesheet" />
    <script src="EFSE_Js/common-functions.js"></script>
    <!-- F7 end -->

    <link href="css/styles_low.css" rel="stylesheet" type="text/css" />

    <script src="Plugin_Js/jquery-3.5.1.min.js" type="text/javascript"></script>
    <script src="cordova.js"></script>
    <script src="js/globlvariable.js"></script>
    <script src="js/jstorage.min.js"></script>
    <script src="js/Storagefile.js"></script>
    <script src="js/changeurl.js" type="text/javascript"></script>
    <script src="EFSE_Js/controls-ele.js"></script>
    <script src="EFSE_Js/pending_status.js" type="text/javascript"></script>
    <style type="text/css">
        #uploaded_list_grid {
            text-align: left;
        }

            #uploaded_list_grid li {
                word-break: break-all;
                border: 1px solid gray;
                padding: 5px;
                margin: 2px 0px;
                font-size: 10pt;
            }
    </style>
    <script type="text/javascript">
        var username = JSON.parse(storage.getItem('username'));
        var imeino = JSON.parse(storage.getItem('imeino'));
        var uniqcode = JSON.parse(storage.getItem('uniqcode'));
        var wayflow = JSON.parse(storage.getItem('wayflow'));
        var global_url = JSON.parse(storage.getItem('global_url'));
        var global_wcf_url = JSON.parse(storage.getItem('global_wcf_url'));
        var common_global_wcf_url = JSON.parse(storage.getItem('common_global_wcf_url'));
        var page_load_over = 0;

        // mobile view (F7 View/old View)
        var F7_view = JSON.parse(storage.getItem('F7_view'));
        var F7_device = JSON.parse(storage.getItem('F7_device'));

        $(document).ready(function () {
            //
        });

        document.addEventListener('deviceready', function showValues() {
            pageload_main();
            function pageload_main() {
                if (typeof (myApp) != "undefined") {
                    make_upload_call();
                }
                else {
                    setTimeout(function () { pageload_main(); }, 500);
                }
            }

            document.addEventListener("backbutton", function (e) {
                //var seconds = getPageLoadTime();
                //if (seconds > 3) {
                if (page_load_over == 1) {
                    back_button('pending_status');
                }
            }, true);

            if (F7_device == "ios") {
                $(".panel-nav-ios").show();
                $(".panel-nav").hide();
            }
            else {
                $(".panel-nav-ios").hide();
                $(".panel-nav").show();
            }

            var doc = new MkDocInits();
            doc._initF7(doc);
            doc._checkSession(doc);
        }, true);
    </script>
</head>
<body>
    <!--  F7 Start -->
    <div class="F7-view" style="width: 100%; height: 100%">
        <div class="statusbar-overlay"></div>
        <div class="panel-overlay"></div>
        <div class="panel-nav"></div>

        <!--ios menu click issue [14102020]-->
        <div class="panel-nav-ios">
            <!-- Navbar Start -->
            <div id="nav_main" class="panel panel-left panel-cover" style="display: block;">
                <div id="nav_sub1" class="view navbar-fixed" data-page="panel-left">
                    <div class="pages">
                        <div id="nav_sub2" data-page="panel-left" class="page">
                            <div class="navbar">
                                <div class="navbar-inner">
                                    <div class="center">Settings</div>
                                </div>
                            </div>
                            <div class="page-content">
                                <div class="content-block profile_photo" style="margin: 0px; background: url(images/bg2.jpg);background-size: 100% 100%;position:relative;">
                                    <ul>
                                        <li style="text-align: center">
                                            <img id="img_profile_ios" src="images/profile_pic.png" onclick="get_full_view_profile_pic()" onerror="set_detault_profile_pic()" style="width: 120px; height: 120px; border-radius: 100px; margin: 0; margin-bottom: 5px;border: 2px solid #fff;">
                                        </li>
                                        <li id="change_photo" class="accordion-item" style="width:28px; display:inline-block; position:absolute;top:100px;right:50px;">
                                            <a href="#" class="item-link item-content">
                                                <div class="item-inner" style="margin-left: 0">
                                                    <div class="item-title"><i id="edit_pro_pic" class="fa fa-pencil" style="font-size: 30px;color: #fff;"></i></div>
                                                </div>
                                            </a>
                                            <div class="accordion-item-content" style="margin-left:0; background: #e5e2e2;opacity:0.9; position:absolute;right:-25px;z-index:999;">
                                                <div class="list-block">
                                                    <ul>
                                                        <li onclick='change_profile_pic("browse")'>
                                                            <div class="item-content">
                                                                <div class="item-inner" style="margin-left: 0">
                                                                    <div class="item-title">BROWSE</div>
                                                                </div>
                                                            </div>
                                                        </li>
                                                    </ul>
                                                </div>
                                            </div>
                                        </li>
                                        <li style="text-align: center; font-size: 13pt; font-weight: bold">
                                            <label id="lblusername" style="margin-bottom: 0; padding-bottom: 0;color: #fff;"></label>
                                            <i id="menu_img_gprs" class="fa fa-circle" style="color: lightgreen; margin-left: 10px"></i>
                                        </li>
                                    </ul>
                                </div>
                                <div class="list-block">
                                    <ul>
                                        <li>
                                            <a onclick="get_my_profile_details_F7()" class="item-link close-panel open-popup">
                                                <div class="item-content">
                                                    <div class="item-media"><i class="fa fa-user"></i></div>
                                                    <div class="item-inner" style="margin-left: 0">
                                                        <div class="item-title">My Profile</div>
                                                    </div>
                                                </div>
                                            </a>
                                        </li>
                                        <li id="change_pass" onclick="localStorage.setItem('change_pwd_flag', 'profile');changeurl('change_password.html');">
                                            <a class="item-link close-panel item-cp">
                                                <div class="item-content">
                                                    <div class="item-media"><i class="fa fa-unlock-alt"></i></div>
                                                    <div class="item-inner" style="margin-left: 0">
                                                        <div class="item-title">Change Password</div>
                                                    </div>
                                                </div>
                                            </a>
                                        </li>
                                        <li onclick="logout_on_click_online()">
                                            <a class="item-link close-panel">
                                                <div class="item-content">
                                                    <div class="item-media"><i class="fa fa-power-off"></i></div>
                                                    <div class="item-inner" style="margin-left: 0">
                                                        <div class="item-title">LogOut</div>
                                                    </div>
                                                </div>
                                            </a>
                                        </li>
                                    </ul>

                                    <ul id="view_database">
                                        <li class="swipeout">
                                            <div class="item-content swipeout-content">
                                            </div>
                                            <div class="swipeout-actions-left">
                                                <a href="#" onclick="resolve_crash_status_issue()" class="swipeout-close" style="background: grey;">Resolve Crash</a>
                                            </div>
                                            <div class="swipeout-actions-right">
                                                <a href="#" onclick="view_database()" class="swipeout-close" style="left: 0; background: grey; margin-left: 2px;">Database</a>
                                            </div>

                                        </li>
                                    </ul>
                                </div>

                                <table style="width:85%; margin:5px 15px">
                                    <tr>
                                        <td><b>ID:</b> 65</td>
                                        <td style="text-align:right"><p id="app_version_ios" style="margin:0"></p></td>
                                    </tr>
                                </table>

                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <!-- Navbar End -->
        </div>
        <!--ios menu click issue [14102020]-->

        <div class="panel-pro"></div>
        <div class="panel-faq"></div>
        <div class="views">
            <div class="view view-main" data-page="list-view">
                <div class="pages navbar-fixed navbar-through toolbar-through">
                    <div data-page="list-view" class="page page-on-center">
                        <div class="navbar">
                            <div class="navbar-inner">
                                <div class="left">
                                    <a onclick='back_button("pending_status")' id="btn_page_back" style="visibility:hidden; pointer-events: none" class="back link icon-only"><i class="icon icon-back"></i></a>
                                </div>
                                <div class="center">
                                    <label id="lbl_theme_header"></label>
                                </div>
                                <div class="right"><a href="#" class="open-panel link icon-only"><i class="icon icon-bars"></i></a></div>
                            </div>
                        </div>
                        <div class="page-content">
                            <div class="list-block" style="padding: 2%">
                                <div style="overflow: hidden; text-align: left; color: White; padding-bottom: 5%; font-size: 10pt">
                                    <label style="color: black">Uploading Data . . .</label>
                                    <span class="progressbar-infinite"></span>
                                </div>
                                <div style="text-align: center">
                                    <table border="1" style="width: 100%; text-align: center; margin-left: auto; margin-right: auto; margin-bottom: 20px; border: 1px solid #aaa">
                                        <tr>
                                            <td colspan="3" height="25px" style="font-size: 12pt; font-weight: bold;">Pending Status </td>
                                        </tr>
                                        <tr>
                                            <td></td>
                                            <td style="font-size: 11pt; font-weight: bold;">Pending </td>
                                            <td style="font-size: 11pt; font-weight: bold;">Total </td>
                                        </tr>
                                        <tr>
                                            <td>Files </td>
                                            <td>
                                                <p id="lbl_pen_f_counter" style="margin: 0px 7px;">0</p>
                                            </td>
                                            <td rowspan="3">
                                                <label id="lbl_total_pending_counter" style="margin: 0px 7px;">0</label>
                                            </td>
                                        </tr>
                                        <tr>
                                            <td>Photos </td>
                                            <td>
                                                <p id="lbl_pen_p_counter" style="margin: 0px 7px;">0</p>
                                            </td>
                                        </tr>
                                        <tr>
                                            <td>Videos </td>
                                            <td>
                                                <p id="lbl_pen_v_counter" style="margin: 0px 7px;">0</p>
                                            </td>
                                        </tr>
                                        <tr>
                                            <td>Tasks </td>
                                            <td colspan="2">
                                                <p id="lbl_pen_t_counter" style="margin: 0px 7px;">0</p>
                                            </td>
                                        </tr>
                                        <tr>
                                            <td>Trips </td>
                                            <td colspan="2">
                                                <p id="lbl_pen_trip_counter" style="margin: 0px 7px;">0</p>
                                            </td>
                                        </tr>
                                    </table>
                                    <a id="btn_retry" class="button button-fill button-raised" style="display: none; width: 10%; float: right" onclick="get_download_counter()">Retry</a>
                                    <a id="btn_go_ahead" class="button button-fill button-raised" style="display: none; width: 25%; float: right" onclick="go_ahead_with_current_data()">Go ahead with current data</a>
                                    <ul id='uploaded_list_grid'></ul>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <script src="Framework7-1.4.2/dist/js/framework7.min.js"></script>
    </div>
    <!--  F7 End-->

    <script>
        pre_init_F7();
    </script>
</body>
</html>
