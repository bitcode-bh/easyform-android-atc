    <script type="text/javascript">
        var username = JSON.parse(storage.getItem('username'));
        var imeino = JSON.parse(storage.getItem('imeino'));

        var curr_survey_data = [];

        //My Global Varibles
        var server_dt_Counter = 0;

        var form_flag;

        // set blank checksheet dependency for class(show/hide elements in all the steps)
        var checksheet_dependency = [];
        storage.setItem('checksheet_dependency', JSON.stringify(checksheet_dependency));
        storage.setItem('progress_step', JSON.stringify(''));

        ///////////

        // mobile view (F7 View/old View)
        var F7_view = JSON.parse(storage.getItem('F7_view'));
        var F7_device = JSON.parse(storage.getItem('F7_device'));
        var itemObj = new MKCheckItem();

        $(document).ready(function () {

            var menu_smallImage = document.getElementById("menu_img_profile");
            var pro_pic_path = get_profile_pic_path_android_ios();
            if (pro_pic_path == '' || pro_pic_path == null || pro_pic_path == undefined) { }
            else {
                menu_smallImage.src = pro_pic_path;
            }

            if (F7_device == "ios") {
                $(".panel-nav-ios").show();
                $(".panel-nav").hide();
            }
            else {
                $(".panel-nav-ios").hide();
                $(".panel-nav").show();
            }

            var doc = new MkDocInits();
            doc._initF7(doc);
            doc._checkSession(doc);
        });

        document.addEventListener('deviceready', function showValues() {
            var data_json = JSON.parse(storage.getItem('list_json'));
            var list_data = JSON.parse(data_json);

            ///////
            var colwise_align = list_data[0].colwise_align;
            if (colwise_align == 'true') {
                $("#div_site_name").hide();
                var TaskListHTML = localStorage.getItem('TaskListHTML');
                document.getElementById('div_site_details').innerHTML = TaskListHTML;

                var site_lat = JSON.parse(storage.getItem('site_lat'));
                var site_long = JSON.parse(storage.getItem('site_long'));
                var str = '';
                var param2 = "get_user_latlong_for_map('" + site_lat + "', '" + site_long + "')";
                str += '<div class="col-50" style="padding-top:7px"><img onclick="' + param2 + '" src="images/NOKIA/Site_Info.png" style="width:40px; height:40px" /></div>';

                var param_weather = "view_weather_for_site('" + site_lat + "', '" + site_long + "')";
                str += '<div class="col-50" style="padding-top:7px"><img onclick="' + param_weather + '" src="images/weather1.png" style="width:40px; height:40px" /></div>';

                document.getElementById('div_site_icons').innerHTML = str;
            }
            else {
                var site_detail = list_data[0].site_detail;
                if (site_detail == 'true') {
                    var sitename = JSON.parse(storage.getItem('sitename'));
                    if (sitename == null || sitename == undefined || sitename == "" || sitename == "0") {
                        sitename = "";
                    }
                    sitename = sitename.substr(0, 15);
                    $('#lbl_site_name').text(sitename);
                }
            }
            //////



            var punching = list_data[0].punching;
            if (punching == 'true') {
                $('.punchinout').parent().show();
                $('.punch-items').show();
            }
            var manual_trip = list_data[0].manual_trip;
            if (manual_trip == 'true') {
                $('.trip-start-stop').parent().show();
            }
            if (punching == "true" && manual_trip == "true") {
                $('.punchinout').parent().parent().css("width", "50%");
                $('.trip-start-stop').parent().parent().css("width", "50%");
            }

            var t_tid = JSON.parse(storage.getItem('tid'));
            var trip_tid = localStorage.getItem('trip_tid');
            if (t_tid == trip_tid) {
                var trip_status = localStorage.getItem('trip_status');
                if (trip_status == '0') {
                    $(".trip-start-stop input[type=checkbox]").prop('checked', true);
                }
            }

            pageload_main();
            function pageload_main() {
                if (typeof (myApp) != "undefined") {
                    check_child_flow_for_parent();
                }
                else {
                    setTimeout(function () { pageload_main(); }, 500);
                }
            }

            document.addEventListener("backbutton", function (e) {
                //var seconds = getPageLoadTime();
                //if (seconds > 3) {
                if (page_load_over == 1) {
                    back_button('viewsitelist_pm_grouplist');
                }
            }, true);
        }, true);


        /**/</script>
