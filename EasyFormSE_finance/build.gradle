plugins {
    id 'com.android.application'
    id 'com.google.ar.sceneform.plugin'
    //used to encrypt string in java class
    //add @StringFogIgnore annotation on class name
//    id 'io.michaelrocks.paranoid'
    id 'com.google.gms.google-services'
    id 'com.google.firebase.crashlytics'
    id 'com.google.android.libraries.mapsplatform.secrets-gradle-plugin'
}
android {
    namespace "com.sky.atc.easyformse"
    compileSdkVersion project.ext.compileSdk
    useLibrary 'org.apache.http.legacy'
    //defualt config set from server
    defaultConfig {
        // Application Configuration
        applicationId "com.easyform.atcpv"
        minSdkVersion project.ext.minSdk  //not set from server
        targetSdkVersion project.ext.targetSdk //not set from server
        versionCode 107    //not set from server
        versionName "ATC_19.6.29_F7_V1.9"
        multiDexEnabled true //not set from server


        resValue "string", "App_URL", "https://atcmwfm.americantower.com/"
        resValue "string", "Video_URL", "https://atcmwfm.americantower.com/Api/"
        resValue "string", "WCFURL", "https://atcmwfm.americantower.com/coreapi/api/"
        resValue "string", "Resumable_URL", "https://atcmwfm.americantower.com/coreapi/api/"
        resValue "string", "Common_Wcf_Url", "https://atcmwfm.americantower.com/coreapi/api/"

        resValue "string", "LOGINWCFURL", "https://atcmwfm.americantower.com/core_login/api/"
        resValue "string", "DOWNLOADWCFURL", "https://atcmwfm.americantower.com/core_download/api/"
        resValue "string", "UPLOADWCFURL", "https://atcmwfm.americantower.com/core_upload/api/"
        resValue "string", "GEOWCFURL", "https://atcmwfm.americantower.com/core_geo/api/"
        resValue "string", "TASKDOWNLOADURL", "https://atcmwfm.americantower.com/core_app_download/api/"
        resValue "string", "OCR", "https://atcmwfm.americantower.com/Azure-OCR/api/"


        resValue "string", "UploadTask", "https://atcmwfm.americantower.com/core_uploadtask/api/"
        resValue "string", "UploadQuestionLog", "https://atcmwfm.americantower.com/core_uploadquestionlog/api/"
        resValue "string", "UploadTechnician", "https://atcmwfm.americantower.com/core_uploadtechnician/api/"


        //SSL", "false"
        resValue "string", "SSL", "false"
        //address api
       // resValue "string", "PATHURL", "http://13.232.162.94:5000/route/v1/driving/"
        // pathurl comment for viu security point Hardcoded IP (26-12-2023)
        resValue "string", "PATHURL","NA"
        //not set from server
        //address api
        resValue "string", "ADDRESSAPI", "NA"
        //shared prefernces secure
        resValue "string", "SECURESHARED", "true"
        //trip map congfiguration
        resValue "string", "TRIPMAPBACK", "false"
        //flad for mock location check
        resValue "string", "MOCKLOCATION", "false"
        // for physical events check
        resValue "string", "EVENTS", "true"
        // for show event activity toast
        resValue "string", "EventToast", "false"
        // for device time stop manual
        resValue "string", "RestrictDeviceTime","true"
        // all permission ask apk install time
        resValue "string", "AllPermission", "false"
        /*ndk {
            abiFilters 'armeabi-v7a','arm64-v8a'
        }*/
    }
    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = ['src']
            resources.srcDirs = ['src']
            aidl.srcDirs = ['src']
            renderscript.srcDirs = ['src']
            res.srcDirs = ['res']
            assets.srcDirs = ['assets']
        }

        androidTest.setRoot('tests')
        debug.setRoot('build-types/debug')
        release.setRoot('build-types/release')
    }

    signingConfigs {
        config {
            keyAlias 'key'
            keyPassword 'skypatel7'
            storeFile file('E:/Android_Studio/key')
            storePassword 'skypatel7'
            v1SigningEnabled true
            v2SigningEnabled true
            enableV3Signing true
            enableV4Signing true
        }
    }
//    applicationVariants.all { variant ->
//        variant.outputs.all {
//            String[] mApplicationId = applicationId.replace(".", "_").split('_')
//            def date = new Date()
//            String dateStr = date.format('yyyy_MM_dd_HH_mm_ss')
//            String mVersionName = versionName.replace(".", "_")
//            // (${versionCode})
//            outputFileName = "EasyForm_${mApplicationId[mApplicationId.length - 1]}_${dateStr}_${mVersionName}.apk"
//        }
//    }

    configurations {
        all {
            exclude module: 'commons-logging'
        }
    }
    buildTypes {
        def isCheckRoot = "isCheckRoot"
        def isCheckDebug = "isCheckDebug"
        def isLogWrite = "isLogWrite"
        release {
            buildConfigField "boolean", isCheckRoot, "true"
            buildConfigField "boolean", isCheckDebug, "true"
            buildConfigField "boolean", isLogWrite, "false"
            signingConfig signingConfigs.config
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android.txt'),
                    'proguard-rules.pro'
        }
        debug {
            buildConfigField "boolean", isCheckRoot, "true" /*"false"*/
            buildConfigField "boolean", isCheckDebug, "false" /*"false"*/
            buildConfigField "boolean", isLogWrite, "false" /*"false"*/
        }
    }


    //NDK for Root detection
    externalNativeBuild {
        cmake {
            path file('cpp/CMakeLists.txt')
        }
    }
    buildFeatures {
        buildConfig = true

    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    androidResources {
        noCompress 'tflite'
    }
    packagingOptions {
       // exclude("META-INF/DEPENDENCIES")
        /*exclude 'META-INF/DEPENDENCIES'
        exclude 'META-INF/LICENSE'
        exclude 'META-INF/LICENSE.txt'
        exclude 'META-INF/license.txt'
        exclude 'META-INF/NOTICE'
        exclude 'META-INF/NOTICE.txt'
        exclude 'META-INF/notice.txt'
        exclude 'META-INF/ASL2.0'
        exclude("META-INF/*.kotlin_module")*/
    }

}

