plugins {
    id 'com.android.application'
    id 'com.google.ar.sceneform.plugin'
    //used to encrypt string in java class
    //add @StringFogIgnore annotation on class name
//    id 'io.michaelrocks.paranoid'
    id 'com.google.gms.google-services'
    id 'com.google.firebase.crashlytics'
    id 'com.google.android.libraries.mapsplatform.secrets-gradle-plugin'
}
android {
    namespace "com.sky.atc.easyformse"
    compileSdkVersion project.ext.compileSdk
    useLibrary 'org.apache.http.legacy'
    //defualt config set from server
    defaultConfig {
        // Application Configuration
        applicationId "com.easyform.atcpv"
        minSdkVersion project.ext.minSdk  //not set from server
        targetSdkVersion project.ext.targetSdk //not set from server
        versionCode 107    //not set from server
        versionName "ATC_19.6.39_F7_V1"
        multiDexEnabled true //not set from server


        resValue "string", "App_URL", "https://mwfm.altiusinfra.com/"
        resValue "string", "Video_URL", "https://mwfm.altiusinfra.com/Api/"
        resValue "string", "WCFURL", "https://mwfm.altiusinfra.com/coreapi/api/"
        resValue "string", "Resumable_URL", "https://mwfm.altiusinfra.com/coreapi/api/"
        resValue "string", "Common_Wcf_Url", "https://mwfm.altiusinfra.com/coreapi/api/"

        resValue "string", "LOGINWCFURL", "https://mwfm.altiusinfra.com/core_login/api/"
        resValue "string", "DOWNLOADWCFURL", "https://mwfm.altiusinfra.com/core_download/api/"
        resValue "string", "UPLOADWCFURL", "https://mwfm.altiusinfra.com/core_upload/api/"
        resValue "string", "GEOWCFURL", "https://mwfm.altiusinfra.com/core_geo/api/"
        resValue "string", "TASKDOWNLOADURL", "https://mwfm.altiusinfra.com/core_app_download/api/"
        resValue "string", "OCR", "https://atcmwfm.americantower.com/Azure-OCR/api/"


        resValue "string", "UploadTask", "https://mwfm.altiusinfra.com/core_uploadtask/api/"
        resValue "string", "UploadQuestionLog", "https://mwfm.altiusinfra.com/core_uploadquestionlog/api/"
        resValue "string", "UploadTechnician", "https://mwfm.altiusinfra.com/core_uploadtechnician/api/"


        //SSL", "false"
        resValue "string", "SSL", "false"
        //address api
       // resValue "string", "PATHURL", "http://13.232.162.94:5000/route/v1/driving/"
        // pathurl comment for viu security point Hardcoded IP (26-12-2023)
        resValue "string", "PATHURL","NA"
        //not set from server
        //address api
        resValue "string", "ADDRESSAPI", "NA"
        //shared prefernces secure
        resValue "string", "SECURESHARED", "true"
        //trip map congfiguration
        resValue "string", "TRIPMAPBACK", "false"
        //flad for mock location check
        resValue "string", "MOCKLOCATION", "false"
        // for physical events check
        resValue "string", "EVENTS", "true"
        // for show event activity toast
        resValue "string", "EventToast", "false"
        // for device time stop manual
        resValue "string", "RestrictDeviceTime","true"
        // all permission ask apk install time
        resValue "string", "AllPermission", "false"
        /*ndk {
            abiFilters 'armeabi-v7a','arm64-v8a'
        }*/
    }
    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = ['src']
            resources.srcDirs = ['src']
            aidl.srcDirs = ['src']
            renderscript.srcDirs = ['src']
            res.srcDirs = ['res']
            assets.srcDirs = ['assets']
        }

        // main.java.srcDirs above claims the whole 'src' tree (not the
        // Android-standard 'src/main/java'), so the plain-JVM unit test
        // sourceSet has to live outside 'src' entirely — otherwise its files
        // get swept into main's own compile too, which has no JUnit on its
        // classpath and fails to build.
        test {
            java.srcDirs = ['test/java']
        }
        androidTest.setRoot('tests')
        debug.setRoot('build-types/debug')
        release.setRoot('build-types/release')
    }

    signingConfigs {
        config {
            keyAlias 'key'
            keyPassword 'skypatel7'
            storeFile (new File('E:/Android_Studio/key').exists() ? new File('E:/Android_Studio/key') : (new File(projectDir, 'keystore/easyform-debug.jks').exists() ? new File(projectDir, 'keystore/easyform-debug.jks') : new File(System.getProperty('user.home'), '.android/debug.keystore')))
//            storeFile file('E:/Android_Studio/key1')   // for security
            storePassword 'skypatel7'
            v1SigningEnabled false
            v2SigningEnabled true
            enableV3Signing true
            enableV4Signing true
        }
    }
//    applicationVariants.all { variant ->
//        variant.outputs.all {
//            String[] mApplicationId = applicationId.replace(".", "_").split('_')
//            def date = new Date()
//            String dateStr = date.format('yyyy_MM_dd_HH_mm_ss')
//            String mVersionName = versionName.replace(".", "_")
//            // (${versionCode})
//            outputFileName = "EasyForm_${mApplicationId[mApplicationId.length - 1]}_${dateStr}_${mVersionName}.apk"
//        }
//    }

    configurations {
        all {
            exclude module: 'commons-logging'
        }
    }
    buildTypes {
        def isCheckRoot = "isCheckRoot"
        def isCheckDebug = "isCheckDebug"
        def isLogWrite = "isLogWrite"
        release {
            buildConfigField "boolean", isCheckRoot, "true"
            buildConfigField "boolean", isCheckDebug, "true"
            buildConfigField "boolean", isLogWrite, "false"
            signingConfig signingConfigs.config
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android.txt'),
                    'proguard-rules.pro'
        }
        debug {
            buildConfigField "boolean", isCheckRoot, "true" /*"false"*/
            buildConfigField "boolean", isCheckDebug, "false" /*"false"*/
            buildConfigField "boolean", isLogWrite, "false" /*"false"*/
        }
    }


    //NDK for Root detection
    externalNativeBuild {
        cmake {
            path file('cpp/CMakeLists.txt')
        }
    }
    buildFeatures {
        buildConfig = true

    }
    testOptions {
        // Standard Android unit-test stub config: without this, any test that
        // reaches an unmocked framework call (e.g. android.location.Location's
        // static distanceBetween(), used by MapSiteLoader) throws instead of
        // running. Test-classpath only — no runtime/app behavior change.
        unitTests {
            returnDefaultValues = true
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    androidResources {
        noCompress 'tflite'
    }
    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
       // exclude("META-INF/DEPENDENCIES")
        /*exclude 'META-INF/DEPENDENCIES'
        exclude 'META-INF/LICENSE'
        exclude 'META-INF/LICENSE.txt'
        exclude 'META-INF/license.txt'
        exclude 'META-INF/NOTICE'
        exclude 'META-INF/NOTICE.txt'
        exclude 'META-INF/notice.txt'
        exclude 'META-INF/ASL2.0'
        exclude("META-INF/*.kotlin_module")*/

        pickFirst 'lib/armeabi-v7a/libc++_shared.so'
        pickFirst 'lib/arm64-v8a/libc++_shared.so'
        pickFirst 'lib/x86/libc++_shared.so'
        pickFirst 'lib/x86_64/libc++_shared.so'

        // ✅ Add these lines to fix libfbjni.so conflict
        pickFirst 'lib/armeabi-v7a/libfbjni.so'
        pickFirst 'lib/arm64-v8a/libfbjni.so'
        pickFirst 'lib/x86/libfbjni.so'
        pickFirst 'lib/x86_64/libfbjni.so'
    }

}

dependencies {
    implementation fileTree(include: '*.jar', dir: 'libs')
    implementation 'androidx.appcompat:appcompat:1.3.1'
    implementation 'com.google.android.material:material:1.4.0'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'

    implementation project(':CordovaLib')
    implementation 'com.google.android.gms:play-services-location:18.0.0'
    implementation 'com.google.firebase:firebase-messaging:17.3.4'
    implementation 'com.google.android.gms:play-services-maps:17.0.1'
    // Marker clustering for the trip site map (PRD FR-21 / §10). Pinned to the
    // 2.x line on purpose: 3.x requires play-services-maps 18.x, and bumping the
    // Maps SDK would reach the existing map screens (navigation,
    // TripBackgroundMapActivity, TripMapUi) that this feature must not disturb.
    implementation 'com.google.maps.android:android-maps-utils:2.3.0'

    implementation 'androidx.multidex:multidex:2.0.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.0'
    testImplementation 'junit:junit:4.13.2'
    // org.json is bundled in android.jar's unit-test stub too (same class of
    // problem as Location above), and its JSONObject/JSONArray constructors
    // don't benefit from returnDefaultValues — a real implementation on the
    // test classpath takes priority over the stub.
    testImplementation 'org.json:json:20230227'
    implementation 'com.google.code.gson:gson:2.8.6'
    implementation 'net.zetetic:android-database-sqlcipher:3.5.9'
    implementation 'com.squareup.okhttp3:okhttp:4.9.0'
    implementation 'com.google.firebase:firebase-crashlytics:18.2.1'
    implementation 'com.google.firebase:firebase-analytics:19.0.1'
    // implementation ("org.jxls:jxls-jexcel:1.0.8") not downgrading added jars
    implementation 'com.itextpdf:itextpdf:5.5.13'
    implementation 'com.itextpdf.tool:xmlworker:5.5.13'
    implementation 'com.scottyab:rootbeer-lib:0.0.7'

    implementation project(path: ':calendarNew')
    implementation project(path: ':library')
    implementation project(path: ':app-measure')
    implementation project(path: ':app-scenForm')

    implementation 'com.google.ar:core:1.25.0'
    implementation 'com.github.judemanutd:autostarter:1.0.8'
    implementation 'com.google.firebase:firebase-ml-vision:19.0.3'
    implementation "androidx.cardview:cardview:1.0.0"

    implementation 'org.tensorflow:tensorflow-lite:2.16.1'
    implementation 'com.google.android.gms:play-services-ads-identifier:17.0.1'
    implementation 'com.google.android.gms:play-services-mlkit-text-recognition:16.2.0'
    implementation 'com.google.mlkit:entity-extraction:16.0.0-beta1'
    //routedraw in google map between 2 latlong
    implementation 'org.slf4j:slf4j-nop:1.7.25'
    implementation 'com.google.maps:google-maps-services:0.2.5'
    implementation 'com.github.bumptech.glide:glide:4.12.0'
    // for biometric login
    implementation 'androidx.biometric:biometric:1.2.0-alpha05'

    // @StringFogIgnore annotation on class name
    implementation 'com.github.megatronking.stringfog:xor:5.0.0'
  //  implementation "com.google.auth:google-auth-library-oauth2-http:1.3.0" // get google access token


    implementation project(path: ':newJitsiModule')
     implementation project(path: ':faceDetectionModel')
     implementation project(path: ':videoapp')  // if any user face video crash issue use videoapp module 09-08-2023

    implementation project(':weatherapp')
    implementation project(':databaseManager')


    api 'com.otaliastudios:cameraview:2.7.2'
}


