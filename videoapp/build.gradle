plugins {
    id 'com.android.library'
}
android {
    namespace "com.example.nitin.newcustomvideorecording"
    compileSdkVersion project.ext.compileSdk


    defaultConfig {
        minSdkVersion project.ext.minSdk
        targetSdkVersion project.ext.targetSdk
    }


    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'),
                    'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
//    applicationVariants.all { variant ->
//        variant.outputs.all {
//            def date = new Date()
//            String dateStr = date.format('yyyy_MM_dd_HH_mm_ss')
//            outputFileName = "EasyFormVideo_${dateStr}_V_${versionCode}.apk"
//        }
//    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}


dependencies {
    implementation 'androidx.appcompat:appcompat:1.3.1'
//    implementation 'com.googlecode.mp4parser:isoparser:1.1.20'
    implementation 'org.mp4parser:isoparser:1.9.41'
    implementation 'org.mp4parser:muxer:1.9.41'
    implementation 'com.github.megatronking.stringfog:xor:5.0.0'
    implementation project(':k4l-video-trimmer')
}
